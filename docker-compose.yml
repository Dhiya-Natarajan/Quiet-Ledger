version: "3.9"

services:
  db:
    image: postgres:15
    container_name: quietledger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quietledger
      POSTGRES_PASSWORD: quietledger_dev
      POSTGRES_DB: quietledger
    ports:
      - "5432:5432"
    volumes:
      - quietledger_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: quietledger-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quietledger.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  communication-service:
    build:
      context: ./services/communication-service
      dockerfile: Dockerfile
    container_name: quietledger-communication-service
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      DATABASE_URL: "postgresql://quietledger:quietledger_dev@db:5432/communication_db?schema=public"
      JWT_SECRET: "quietledger_shared_secret"
      ENABLE_MOCK_SMS: "true"
    depends_on:
      - db

volumes:
  quietledger_pgdata:
